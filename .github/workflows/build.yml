name: Build ControlCenter18 iOS 15

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_DEB_URL: https://github.com/Ray835999/ControlCenter18-iOS15/releases/download/v3.0-beta-ios15.15/ControlCenter18_3.0-beta-ios15.15_arm64.deb
  BASE_DEB_SHA256: 9403952c45d1c86d6e80b93baf0a806ad3a273393bc99303802ca41e8daffcd7
  VERSION: 3.0-beta-ios15.20

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm file python3-pip curl ca-certificates
          python3 -m pip install --disable-pip-version-check lief==1.0.0
          curl -L --fail --retry 3 -o /tmp/ldid \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x /tmp/ldid
          /tmp/ldid -h 2>&1 | head -5 || true
          clang --version | head -1
          ld64.lld --version || true

      - name: Fetch and unpack base package
        run: |
          curl -L --fail --retry 3 -o base.deb "$BASE_DEB_URL"
          echo "$BASE_DEB_SHA256  base.deb" | sha256sum -c -
          python3 tools/extract_deb.py base.deb work
          # The previous diagnostic overlay must not ship in the final tweak.
          rm -f work/data/var/jb/Library/MobileSubstrate/DynamicLibraries/C18Probe.dylib
          rm -f work/data/var/jb/Library/MobileSubstrate/DynamicLibraries/C18Probe.plist

      - name: Build compatibility shim (Linux, no macOS)
        run: |
          mkdir -p build
          COMMON="-dynamiclib -nostdlib -fno-stack-protector -fuse-ld=lld \
            -Wl,-platform_version,ios,15.0,15.0 \
            -Wl,-install_name,/var/jb/Library/MobileSubstrate/DynamicLibraries/CC18ObjCLegacy.dylib \
            -Wl,-undefined,dynamic_lookup"
          clang -target arm64-apple-ios15.0 $COMMON \
            shim/CC18Compat.c shim/CC18Compat.S -o build/CC18Compat_arm64.dylib
          clang -target arm64e-apple-ios15.0 $COMMON \
            shim/CC18Compat.c shim/CC18Compat.S -o build/CC18Compat_arm64e.dylib
          # clang/lld on Linux leaves cpusubtype 0 even for arm64e.  Fix the
          # thin header before signing so the fat header and the inner header
          # agree; iOS's dyld checks both.
          python3 - <<'PY'
          import struct
          p = 'build/CC18Compat_arm64e.dylib'
          data = bytearray(open(p, 'rb').read())
          struct.pack_into('<I', data, 8, 0x80000002)
          open(p, 'wb').write(data)
          print('arm64e cpusubtype patched')
          PY
          /tmp/ldid -S build/CC18Compat_arm64.dylib
          /tmp/ldid -S build/CC18Compat_arm64e.dylib
          python3 -c "import struct; [print(f, hex(struct.unpack_from('<I', open(f,'rb').read(), 8)[0])) for f in ('build/CC18Compat_arm64.dylib','build/CC18Compat_arm64e.dylib')]"
          python3 tools/make_fat.py build/CC18Compat.dylib \
            build/CC18Compat_arm64.dylib build/CC18Compat_arm64e.dylib
          cp build/CC18Compat.dylib \
            work/data/var/jb/Library/MobileSubstrate/DynamicLibraries/CC18ObjCLegacy.dylib
          file build/CC18Compat.dylib

      - name: Redirect Substrate imports to the compat shim
        run: |
          MAIN=work/data/var/jb/Library/MobileSubstrate/DynamicLibraries/ControlCenter18.dylib
          python3 tools/patch_imports.py "$MAIN" \
            _MSHookMessageEx _MSHookFunction _MSHookMemory
          # Any other image that picked up a Substrate reference gets the same
          # treatment.  Preference bundles normally do not link it.
          find work/data -type f | while read -r f; do
            if file "$f" | grep -q 'Mach-O'; then
              python3 tools/patch_imports.py "$f" \
                _MSHookMessageEx _MSHookFunction _MSHookMemory || true
            fi
          done

      - name: Sign patched images
        run: |
          /tmp/ldid -S work/data/var/jb/Library/MobileSubstrate/DynamicLibraries/ControlCenter18.dylib
          /tmp/ldid -S work/data/var/jb/Library/PreferenceBundles/ControlCenter18Prefs.bundle/ControlCenter18Prefs
          /tmp/ldid -S work/data/var/jb/Library/MobileSubstrate/DynamicLibraries/ControlCenter18Settings.dylib
          /tmp/ldid -S work/data/var/jb/Library/MobileSubstrate/DynamicLibraries/ControlCenter18Modules.dylib
          /tmp/ldid -S work/data/var/jb/Library/MobileSubstrate/DynamicLibraries/ControlCenter18Favorite.dylib

      - name: Verify shim exports and flat imports
        run: |
          NM=$(command -v llvm-nm || command -v llvm-nm-14)
          "$NM" --defined-only build/CC18Compat.dylib | grep -q _objc_claimAutoreleasedReturnValue
          "$NM" --defined-only build/CC18Compat.dylib | grep -q _objc_release_x19
          "$NM" --defined-only build/CC18Compat.dylib | grep -q _objc_retain_x19
          "$NM" --defined-only build/CC18Compat.dylib | grep -q _MSHookMessageEx
          python3 tools/check_flat.py work/data/var/jb/Library/MobileSubstrate/DynamicLibraries/ControlCenter18.dylib

      - name: Pack rootless deb
        run: |
          mkdir -p dist
          cp control work/ctrl/control
          cp postinst work/ctrl/postinst
          chmod 755 work/ctrl/postinst
          python3 tools/pack_deb.py work/data work/ctrl/control \
            "dist/ControlCenter18_${VERSION}_arm64.deb" "$VERSION"
          dpkg-deb -I "dist/ControlCenter18_${VERSION}_arm64.deb" || true
          python3 tools/check_deb.py "dist/ControlCenter18_${VERSION}_arm64.deb"
          # Real dpkg unpack into a throw-away root.  This is the test that
          # catches missing parent-directory entries before the device does.
          sudo rm -rf /tmp/cc18root
          sudo mkdir -p /tmp/cc18root/var/lib/dpkg/info /tmp/cc18root/var/lib/dpkg/updates
          sudo touch /tmp/cc18root/var/lib/dpkg/status
          sudo dpkg --root=/tmp/cc18root --force-architecture --unpack \
            "dist/ControlCenter18_${VERSION}_arm64.deb"
          test -f "/tmp/cc18root/var/jb/Library/Application Support/ControlCenter18/ControlGlyphs18.json"
          test -f "/tmp/cc18root/var/jb/Library/MobileSubstrate/DynamicLibraries/CC18ObjCLegacy.dylib"
          test -f "/tmp/cc18root/var/jb/Library/PreferenceBundles/ControlCenter18Prefs.bundle/ControlCenter18Prefs"
          echo "dpkg unpack OK"
          sha256sum dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: ControlCenter18-${{ env.VERSION }}-arm64
          path: dist/*.deb
          if-no-files-found: error
